<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevEye</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      body {
        box-sizing: border-box;
        min-width: 240px;
        margin: 0;
        padding: 18px;
        background: linear-gradient(145deg, #111827, #1f2937);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 4px;
        font-size: 18px;
        letter-spacing: 0.02em;
      }

      .brand img {
        width: 28px;
        height: 28px;
        border-radius: 7px;
      }

      .description {
        margin: 0 0 18px;
        color: #9ca3af;
        font-size: 12px;
      }

      .control {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .status {
        color: #d1d5db;
        font-size: 13px;
        font-weight: 600;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
      }

      .switch input {
        width: 0;
        height: 0;
        opacity: 0;
      }

      .slider {
        position: absolute;
        inset: 0;
        cursor: pointer;
        border-radius: 999px;
        background: #4b5563;
        transition: background 150ms ease;
      }

      .slider::before {
        position: absolute;
        width: 18px;
        height: 18px;
        left: 3px;
        bottom: 3px;
        border-radius: 50%;
        background: #fff;
        content: "";
        transition: transform 150ms ease;
      }

      input:checked + .slider {
        background: #2563eb;
      }

      input:checked + .slider::before {
        transform: translateX(20px);
      }

      input:focus-visible + .slider {
        outline: 2px solid #93c5fd;
        outline-offset: 2px;
      }

      #message {
        min-height: 16px;
        margin: 14px 0 0;
        color: #fca5a5;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1 class="brand">
      <img src="assets/32.png" alt="">
      <span>DevEye</span>
    </h1>
    <p class="description">Inspect computed CSS on any page.</p>
    <div class="control">
      <span id="status" class="status">Inspector off</span>
      <label class="switch" aria-label="Toggle CSS inspector">
        <input id="toggle" type="checkbox">
        <span class="slider"></span>
      </label>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
    <script src="popup.js"></script>
  </body>
</html>

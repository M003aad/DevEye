name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Package extension
        run: zip -r "DevEye-${GITHUB_REF_NAME}.zip" manifest.json content.js content.css overlay.css popup.html popup.js assets
      - name: Attach archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: DevEye-${{ github.ref_name }}.zip
